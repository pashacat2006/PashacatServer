# Длительность теста по умолчанию в секундах. 0 - пока не выключишь командой.
default-seconds: 60
# Тик дольше этого (в миллисекундах) считается лагом.
lag-spike-ms: 100
# Радиус в блоках, в котором считаются сущности вокруг игрока.
entity-radius: 48
# Сохранять итог теста в plugins/TesterDebug/reports.
save-reports: true
