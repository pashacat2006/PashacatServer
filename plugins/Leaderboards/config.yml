# Как часто (в секундах) обновлять значения игроков и топы.
update-seconds: 10
# С какого расстояния (в блоках) видно топ.
view-distance: 48
# Показывать ник над персонажем первого места.
npc-show-name: false
# На какой высоте над персонажем начинается текст топа.
text-height: 2.2
# Расстояние между строками в блоках.
line-spacing: 0.27
# Ширина строки текста (больше - шире голограмма).
line-width: 300
# Фон под каждой строкой (ARGB). Фон подстраивается под длину своей строки. 0 - без фона.
background: '#50000000'

# Оформление по умолчанию. Можно переопределить у каждого топа в boards.yml.
# {board} - id топа, {place} - место, {player} - ник, {value} - значение, {total} - сколько игроков в топе.
# Цвета: &a, &l и т.д. или &#RRGGBB.
format:
  title: '&6&l{board}'
  line-1: '&6&l#1 &e{player} &7- &a{value}'
  line-2: '&f&l#2 &f{player} &7- &a{value}'
  line-3: '&c&l#3 &f{player} &7- &a{value}'
  line: '&7#{place} &f{player} &7- &a{value}'
  empty-line: '&8#{place} ---'
  footer: '&7Игроков в топе: &f{total}'
  self: '&7Ты на &e#{place} &7месте: &a{value}'
  no-self: '&7Тебя пока нет в топе'
  no-data: '&7Пока нет данных'
