#
# Teleports to thr target, dealing damage and knocking 
# all nearby players away
#
# Cooldown is in seconds
SmashAttack:
  Cooldown: 8
  Conditions:
  - targetwithin{d=25}
  Skills:
  - message{cooldown=30;m="<mob.name><&co> Hahahah! I will crush you, fool!"} @PlayersInRadius{r=40}
  - teleport @target
  - effect:sound{s=mob.endermen.portal;volume=1.0;pitch=0.5}
  - delay 10
  - damage{amount=5;ignorearmor=true} @PlayersInRadius{r=5}
  - throw{velocity=10;velocityY=5} @PlayersInRadius{r=5}
  - effect:explosion @Self
  
LavaGolemHitMessage:
  Cooldown: 200
  Skills:
    - delay 200
    - 'message{m="&6Лава&0Голем: &cУходи!"} @trigger'

LavaGolemSummonClones:
  Cooldown: 999999
  Conditions:
    - healthpercent{p=<40}
  Skills:
    - 'message{m="&6Лава&0Голем: &cПрислуга!"} @PlayersInRadius{r=30}'
    - summon{type=LavaGolemClone;amount=5;radius=3} @self

#
# Summons 2 skeletons every second for 3 seconds.
#
SummonSkeletons:
  Cooldown: 15
  Skills:
  - message{m="<caster.name><&co> Arise, my minions!"} @PlayersInRadius{r=40}
  - delay 20
  - summon{type=SKELETON;amount=2;noise=5} @Self
  - delay 20
  - summon{type=SKELETON;amount=2;noise=5} @Self
  - delay 20
  - summon{type=SKELETON;amount=2;noise=5} @Self

#
# Poisons all players within 15 blocks
#
AngrySludgePoison:
  Cooldown: 10
  Skills:
  - potion{type=POISON;lvl=2;duration=100} @PlayersInRadius{r=15}
  - effect:particles{p=happyVillager;amount=1000;hSpread=15;ySpread=1;speed=0;yOffset=0.5} @Self

#
# Skills used by the buttons in dialogs/ExampleDialogs.yml
#
ExampleQuestAccepted:
  Skills:
  - 'message{m="<green>Вы приняли задание!"} @self'

ExampleQuestDeclined:
  Skills:
  - 'message{m="<red>Вы отказались от задания."} @self'

ExampleCharacterConfirmed:
  Skills:
  - 'message{m="<green>Настройки персонажа сохранены."} @self'
