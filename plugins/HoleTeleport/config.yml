# HoleTeleport - зоны, которые выполняют команду.
# Координаты - это блоки. Зона включает оба угловых блока целиком.
# По высоте можно указать и блок, на котором стоит игрок, и блок над ним - сработает в обоих случаях.
#
# command  - команда без "/". %player% заменяется на ник игрока.
# asPlayer - true: команду пишет сам игрок, false: команда от консоли.
# interval - 0: команда один раз при входе в зону,
#            больше 0: команда каждые столько секунд, пока игрок стоит в зоне.

zones:
  example_zone:
    world: world
    x1: -94
    y1: 47
    z1: 99
    x2: -98
    y2: 47
    z2: 95
    command: "rtp"
    asPlayer: true
    interval: 0
  leader_zone:
    world: world
    x1: -110
    y1: 61
    z1: 97
    x2: -110
    y2: 61
    z2: 98
    command: "eco give %player% 1"
    asPlayer: false
    interval: 1
