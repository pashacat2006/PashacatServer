help:
- '&a -- Помощь по LootChest --'
- '&a(автор Black_Eyes, идея Ender_Griefeur99)'
- '&a/lc copy <откуда> <куда> &b: скопировать сундук в другой'
- '&a/lc create <название> &b: создать сундук и открыть меню'
- '&a/lc edit <название> &b: открыть меню настройки'
- '&a/lc give <название> <игрок>&b: выдать сундук игроку'
- '&a/lc getname &b: узнать название сундука, на который смотрите'
- '&a/lc help &b: эта справка'
- '&a/lc despawn <название> &b: убрать сундук'
- '&a/lc despawnall [мир] &b: убрать все сундуки, можно в одном мире'
- '&a/lc list &b: список всех сундуков'
- '&a/lc locate &b: где находятся сундуки с сообщением о появлении'
- '&a/lc maxfilledslots <название> <число> &b: максимум заполненных слотов'
- '&a/lc randomspawn <название> <радиус> &b: случайное появление в радиусе (0 — выключить)'
- '&a/lc reload &b: перезагрузить плагин'
- '&a/lc remove <название> &b: удалить сундук'
- '&a/lc respawn <название> &b: заново создать сундук'
- '&a/lc respawnall [мир] &b: заново создать все сундуки, можно в одном мире'
- '&a/lc setholo <название> <текст> &b: голограмма над сундуком'
- '&a/lc setpos &b: перенести сундук на ваше место'
- '&a/lc setprotection <название> <время> &b: время защиты после появления, в секундах'
- '&a/lc settime <название> &b: время появления сундука в минутах'
- '&a/lc togglefall <название> &b: вкл/выкл эффект падения'
- '&a/lc tp <название> &b: телепорт к сундуку'
