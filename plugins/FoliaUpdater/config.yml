# Папки внутри plugins/FoliaUpdater. Сюда кладутся jar Paper, не в plugins сервера.
# singlethread — плагины одного потока Paper. Их синхронные задачи не идут параллельно
# друг с другом и остаются на регионе Folia, откуда их поставили. Если региона нет,
# задача выполняется на global region (ближайший аналог главного потока).
# multithread — плагины, которые уже рассчитаны на несколько потоков. Синхронные задачи
# остаются на своём регионе и могут идти параллельно, асинхронные — в пуле Folia.
singlethread-folder: singlethread
multithread-folder: multithread
# Какой плагин после каких грузить, если в его plugin.yml этого не написано.
# RealMines берёт экономику из Vault один раз при включении, поэтому Essentials должен включиться раньше.
load-after:
  RealMines: [Essentials]
